<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <meta charset="UTF-8">
  </head>
  <body onload="getmatchlength()">
    <br>
    <button class="backbutton" onclick="gotomenu()">back</button>
    <center>
      <h1>AI MATCH</h1>
      <h2 id="matchtext">First to 5 points wins!</h2>
      <br>
      <br>
      <div class="nicecontainer">
        <div>
          <p>Choose your move:</p>
          <button id="rock" onclick="selectMove('rock')">✊</button>
          <button id="paper" onclick="selectMove('paper')">📄</button>
          <button id="scissors" onclick="selectMove('scissors')">✂️</button>
        </div>
        <div class="moves-container">
          <h1 id="pscore">0:0</h1>
          <div id="playersbox" class = "movebox">
            _
          </div>
          <div id="enemybox" class = "movebox">
            ?
          </div>
          <h1 id="escore">0:0</h1>
        </div>
        <button id="matchbutton" onclick="match()">Match</button>
        <h2 id="logtext">Press match to start game!</h2>
        <br>
      </div>
    </center>
  </body>
</html>
